- title: Professional Summary
  type: list
  contents:
    - AI researcher and engineer with a Ph.D. in Computer Science and 8+ years of cross-functional experience spanning applied generative AI, multi-turn dialogue systems, and high-performance hardware architecture.
    - Engineered domain-specific large language models, leveraging advanced Knowledge-Augmented Generation (KAG) and GraphRAG to drive complex, agentic reasoning for clinical applications.
    - Deep expertise spanning the entire AI lifecycle — from constructing high-fidelity training datasets and applying SFT/RL, to deploying memory-efficient inference pipelines.
    - Former Senior Engineer at Marvell and Skyworks with multiple granted patents, bringing a rigorous, hardware-aware perspective to deploying robust, scalable machine learning models into production.

